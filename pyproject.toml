[project]
name = "carecompare"
version = "0.1.0"
description = "Healthcare price and quality comparison platform"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic==1.16.5",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "polars==1.32.3",
  "psycopg[binary]==3.2.9",
  "pydantic-settings==2.10.1",
  "sqlalchemy==2.0.43",
  "structlog==25.4.0",
  "uvicorn[standard]==0.35.0",
]

[dependency-groups]
dev = [
  "mypy==1.17.1",
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "ruff==0.12.10",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions"]

[tool.pytest.ini_options]
testpaths = ["services/api/tests", "collectors/cms_hospitals/tests", "collectors/cms_quality/tests", "collectors/hospital_prices/tests", "packages/database/tests", "packages/search/tests"]
addopts = "--strict-markers --disable-warnings"
pythonpath = ["."]
