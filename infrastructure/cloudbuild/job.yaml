steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file
      - infrastructure/docker/job.Dockerfile
      - --tag
      - ${_IMAGE_URI}:${_IMAGE_TAG}
      - .
images:
  - ${_IMAGE_URI}:${_IMAGE_TAG}
options:
  logging: CLOUD_LOGGING_ONLY
substitutions:
  _IMAGE_URI: us-east4-docker.pkg.dev/carecompare-development/carevero/job
  _IMAGE_TAG: dev
timeout: 1200s
