services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-carecompare}
      POSTGRES_USER: ${POSTGRES_USER:-carecompare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carecompare_local_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - carecompare_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  carecompare_postgres:
